<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App _Flask</title>
</head>
<body>
    <h1>{{ hello }}</h1>

    <!-- Formulário acrecentado -->
    <form action="{{ url_for('main_bp.home') }}" method="post"> <!-- Formulário para enviar dados via POST --> <br>
        <label for="name">Nome:</label>
        <input type="text" name="name" placeholder="Digite seu nome"> <br><br>
    
    
        <label for="email">Email:</label>
        <input type="email" name="email" placeholder="Digite seu email"> <br><br>
    
    
        <label for="password">Senha:</label>
        <input type="password" name="password" placeholder="Digite sua senha"> <br><br>
    
    
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
