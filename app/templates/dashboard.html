{% extends 'base.html' %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class="container mt-4 fade-in">
    <h2 class="mb-4 text-gradient">Painel de Usuários</h2>
    {% if dados %}
    <div class="table-responsive glass">
        <table class="table table-dark table-hover align-middle mb-0">
            <thead class="table-gradient">
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody>
                {% for item in dados %}
                <tr>
                    <td>{{ item.id }}</td>
                    <td>{{ item.nome }}</td>
                    <td>{{ item.email }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% else %}
    <div class="alert alert-warning glass">Nenhum dado encontrado.</div>
    {% endif %}
</div>
{% endblock %}
